pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "**/*.stories.tsx|**/__tests__/**/*.tsx|.storybook/**/*"
      run: npx eslint {staged_files}
    types:
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "**/*.stories.tsx|**/__tests__/**/*.tsx|.storybook/**/*"
      run: npx tsc --noEmit --project tsconfig.build.json
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
